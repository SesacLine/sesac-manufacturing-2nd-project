name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 설치는 저장소 루트에서 — 통합 pyproject.toml 하나로 backend/kg_rca/secsgem-mcp 전부
      # (pytest·PyYAML도 root 의존성에 포함)
      - run: pip install -e .
      # secsgem-mcp 테스트 — #86에서 cwd 의존을 제거(Path(__file__) 앵커)해 루트에서 그대로 돈다
      - run: pytest -q -m "not data" secsgem-mcp/tests
      # backend·kg_rca는 위 스텝 범위 밖(게이트는 아직 secsgem-mcp/tests만).
      # 지금까지 무게이트였으므로 우선 관찰 모드로 켜고, ubuntu에서 안정 확인 후 게이트로 승격한다.
      - name: backend + kg_rca tests (observe only)
        if: always()
        run: pytest -q -m "not data" backend/tests kg_rca/tests
        continue-on-error: true

  # 프론트 E2E — API를 목킹한 UI 검증(실백엔드·LLM·fab.db 불필요)이라 파이썬 잡과 독립.
  # 배치를 실제로 도는 E2E는 실LLM 1~2분이 들어 CI에 올리지 않는다(backend는 BATCH_E2E=1 opt-in).
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 브라우저는 chromium만 — 나머지는 이 스위트에서 안 쓴다(다운로드 시간 절약).
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts의 webServer가 build + vite preview를 알아서 띄운다.
      - name: playwright (observe only)
        run: npx playwright test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7